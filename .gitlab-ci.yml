stages:
  - build
  - test
  - deploy

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/api"
    - docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE_NAME:latest"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

test:
  stage: test
  script:
    - echo 'ok'

deploy:
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /home/ubuntu/app &&
       git pull &&
       docker login -u \"$CI_REGISTRY_USER\" -p \"$CI_REGISTRY_PASSWORD\" \"$CI_REGISTRY\" &&
       API_IMAGE=\"$CI_REGISTRY_IMAGE/api:latest\" docker compose -f docker-compose.deploy.yaml pull &&
       API_IMAGE=\"$CI_REGISTRY_IMAGE/api:latest\" docker compose -f docker-compose.deploy.yaml up -d"
  needs:
    - build_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'