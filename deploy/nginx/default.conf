server {
    listen 80;
    server_name team-22-stage-e7e64b.pages.prodcontest.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name team-22-stage-e7e64b.pages.prodcontest.ru;

    ssl_certificate /etc/letsencrypt/live/team-22-stage-e7e64b.pages.prodcontest.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-22-stage-e7e64b.pages.prodcontest.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}